Pendulum-v1:
  n_timesteps: 20000
  policy: 'MlpPolicy'
  gamma: 0.98
  buffer_size: 200000
  learning_starts: 10000
  noise_type: 'normal'
  noise_std: 0.1
  gradient_steps: 1
  train_freq: 1
  learning_rate: !!float 1e-3
  batch_size: 100
  tau: 0.001
  target_update_interval: 2
  policy_kwargs: "dict(net_arch=[400, 300], low_rank_rank=2)"

# === Mujoco Envs ===
HalfCheetah-v4: &mujoco-defaults
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  learning_starts: 10000
  noise_type: 'normal'
  noise_std: 0.1
  train_freq: 1
  gradient_steps: 1
  learning_rate: !!float 1e-3
  batch_size: 100
  tau: 0.001
  target_update_interval: 2
  policy_kwargs: "dict(net_arch=[400, 300], low_rank_rank=2)"

Hopper-v4:
  <<: *mujoco-defaults

Ant-v4:
  <<: *mujoco-defaults

Walker2d-v4:
  <<: *mujoco-defaults

Humanoid-v4:
  <<: *mujoco-defaults
  n_timesteps: !!float 2e6